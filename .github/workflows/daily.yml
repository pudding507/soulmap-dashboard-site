name: SoulMap dashboard daily
on:
  schedule:
    # 🔴 2026-11-12 改回一天 4 次,全部排在 12:20 之后。
    #    **2026-11-05 那次砍到 1 次/天的理由是错的** —— 当时写「省 Actions 免费额度、
    #    私有仓库每月 2,000 分钟」,但 `pudding507/soulmap-dashboard-site` 是 **公开仓库**,
    #    公开仓库的标准 runner **不计费、不占那 2,000 分钟**,一直没有额度问题。
    #    🛑 要是哪天把仓库转成私有,这段话才重新成立,那时再按 17.3 分钟/次重算。
    #
    #    为什么只排 12:20 之后:firebase 的 ETL 实测落在 11:02 上下,早于 12:20 的 run
    #    会拿到**前天**的埋点数,而页面上没有任何标记。12:20 之后的几次拿的是同一批
    #    埋点数,但**服务端那半边是实时的**(订阅 / 聊天 / 能量各表),多跑几次是为了
    #    ① 让服务端口径的卡当天就能更新;② 把上一次 504 掉的硬骨头卡重抓一遍
    #    (实测每次都有 3~5 张撞 60 秒网关超时)。
    #    guard(抓到 <35 张就不发布)仍然在,抓砸了线上保留上一版,不会出半截页面。
    #
    # 时间按新加坡(UTC+8)排;GitHub cron 只认 UTC,所以减 8 小时。
    # ⚠️ 计划任务是 best-effort:实测常晚 40min~2.5h,高负载时整次跳过。
    #
    # 🔴 2026-11-05 由 11:20 挪到 **12:20**,原因是 ETL 余量太薄,不是因为库忙:
    #    ① **ETL 余量**:实测昨天的 firebase 数落库时刻 11-03 是 10:01、
    #       **11-04 是 11:02、11-05 是 11:02** —— 近三天有两天压着 11:03 那条线。
    #       排 11:20 只剩 18 分钟余量,ETL 稍微晚一点,整天的页面就会拿到**前天**的
    #       firebase 数,而且页面上没有任何标记。挪到 12:20 余量变成 78 分钟。
    #    ② **库忙不是问题**:实测近 7 天每小时用户消息量,SGT 11 点是 416 条/时,
    #       全天第 6 低(最高是 02 点 652、17 点 577、22 点 572);12 点 522 条/时,
    #       仍比峰值低两成。而且 11-05 那次手动跑是 **17:33 起跑(全天第二忙的时段)**,
    #       83/86 张、17 分钟跑完;11-03 那次灾难性的 79 分钟反而起于 20:04(较闲时段)——
    #       **慢的根因是 socket 涓流超时那个 bug(已修),跟 App 流量没有关系。**
    #    ③ **Actions 的 cron 是 best-effort**,实测常晚 40min~2.5h ⇒ 实际起跑多半落在
    #       13:00~14:50,那也正好避开 17 点以后和凌晨那两段高峰。
    #
    # 2026-09-07 定下的两条仍然适用:
    #  ① 必须排在 ETL 之后才能稳定拿到昨天的数 —— 排早了会变成"ETL 比它早就有昨天、
    #     比它晚就只有前天",同一张卡隔天口径不同,比晚一小时更糟。
    #  ② 分钟数从整点挪到 :20。Actions 在每小时 :00 排队最挤,错开能实测缩短延迟。
    # 🔴 2026-11-20 改成**一天一次、只做补位**。
    #    此前这里和主机的 launchd 排了**完全相同的四个时刻**,
    #    GitHub billing 一解开两边就会同时跑。同时跑的真正危害不是浪费:
    #      ① `anomaly_history.json` 会互相覆盖 —— 它是「连续上榜就压制」那条规则的
    #         唯一依据,后推的盖掉前推的,压制规则会永远读到残缺历史;
    #      ② `logs/runs.jsonl` 两边各追加,rebase 时可能丢记录;
    #      ③ 同一时刻 2×88 张重查询压 Metabase,本来每轮就有 3~5 张撞 60 秒网关超时。
    #    ⇒ **主机做主**(四次,launchd 准时),**Actions 做补位**(一次,主机挂了才接手)。
    #    为什么不是反过来:下面那句「计划任务 best-effort,常晚 40min~2.5h」是 Actions 的
    #    老毛病,而 launchd 是准时的。但主机依赖开机和办公室网络、没人看着,所以 Actions
    #    不关掉,改成真正的备份。
    - cron: "20 14 * * *"   # 新加坡 22:20 —— 主机最后一次是 21:20,留一小时判断它成没成功
    # 🛑 以下两个保持关闭,**都早于 12:20**,跑了只会拿到前天的 firebase 数:
    #  - cron: "20 3 * * *"   # 新加坡 11:20(2026-11-05 之前用的,ETL 余量只有 18 分钟)
    #  - cron: "20 20 * * *"  # 新加坡 04:20(2026-11-05 之前用的,离当天 ETL 还有 7 小时)
  workflow_dispatch: {}

# 2026-09-16 新增。GitHub cron 是 best-effort,实测常晚 40min~2.5h ——
# 延迟大的时候前一次还在跑、下一次就排上来了,两次 run 同时对 Metabase 打 4 并发,
# 47 张卡每张都要全表扫 firebase_event(无 event_name 索引),Metabase 被压住后
# 连 /api/session 都会超时。这里让同组的 run 排队而不是叠加。
# cancel-in-progress: false —— 正在跑的那次可能已经抓到大半,别掐掉。
concurrency:
  group: soulmap-dashboard
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  # 🔴 2026-11-20 新增。这一步决定今天要不要跑 —— 见上面 schedule 那段。
  #    依据是仓库里的 `logs/runs.jsonl` 最后一行(主机每轮都会推上来)。
  #    🛑 **同时看 run_date 和 n_cards**:只看日期的话,主机「跑了但抓砸了」
  #       (guard 拦下、没发布)也会被当成跑过,那天就彻底没人补位了。
  standby-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发,不做补位判断,直接跑"
            echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=Asia/Singapore date +%F)
          LAST=$(tail -1 logs/runs.jsonl 2>/dev/null || echo '{}')
          RUN_DATE=$(echo "$LAST" | python3 -c "import sys,json;print((json.load(sys.stdin) or {}).get('run_date',''))" 2>/dev/null || echo '')
          N=$(echo "$LAST" | python3 -c "import sys,json;print((json.load(sys.stdin) or {}).get('n_cards',0))" 2>/dev/null || echo 0)
          echo "今天=$TODAY  仓库里最后一轮=$RUN_DATE  抓到 $N 张"
          if [ "$RUN_DATE" = "$TODAY" ] && [ "$N" -ge 35 ]; then
            echo "✅ 主机今天已经跑过并发布($N 张),补位不用跑"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 仓库里最后一轮是 $RUN_DATE / $N 张 —— 主机今天没跑成,这次接手"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: standby-check
    if: needs.standby-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 2026-09-16 新增。放在 fetch 之前,因为抓数要 10 多分钟 ——
      # 渲染脚本的语法错如果等到 render 那步才暴露,这一整轮卡全白抓了。
      # 实测踩过:卡片定义列表里两条元组之间漏了逗号(中间还隔着注释行),
      # Python 读成 (元组)(元组) 去调用,报 TypeError 而不是 SyntaxError。
      # 用 -W error::SyntaxWarning 把「perhaps you missed a comma」这类警告升成错误才拦得住。
      - name: syntax check
        run: |
          python3 -W error::SyntaxWarning -c "
          import ast, sys
          for f in ['fetch_metabase.py', 'render_dashboard.py', 'render_energy_ab.py', 'fetch_changes.py']:
              src = open(f).read()
              ast.parse(src)
              compile(src, f, 'exec')
              print(f'  OK {f}')
          "

      # 配置自检 + movers 口径 + 中英拆分,38 条,不连库不连 Metabase,几十毫秒跑完。
      # 放在抓数前面:卡没在 KEY_OVERRIDE 里登记、fmt 写错、列名拆不出英文这类
      # 等到渲染完才发现,一整轮卡就白抓了。
      - name: unit tests
        run: python3 -m unittest discover -s tests -v

      - name: fetch
        env:
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        # 并发抓卡:第1轮 4 并发拼吞吐,第2轮 2、第3轮 1,后面几轮只剩硬骨头,降并发给每张卡完整带宽。
        # 实测(2026-08-04):串行 6 轮 55 分钟 / 缺 7  →  平并发4 12 分钟 / 缺 6  →  递减 17 分钟 / 缺 7。
        # ⚠️ 2026-10-19 起抓两个看板(18+24),卡数 51 → 73,整体耗时会比上面那组实测更长。
        # 那 6-7 张卡在 Metabase 侧就是 >60 秒,并发 1 也救不回来 —— 调度到此为止,要归零得靠兜底。
        run: python3 fetch_metabase.py --out raw_metrics.json
      # 这一轮抓了多久、哪几张卡慢、哪几张没抓到 —— 追加到 logs/runs.jsonl。
      # always():抓数部分失败也要记,失败本身就是要观察的现象。
      - name: log run
        if: always()
        run: python3 log_run.py

      # 2026-11-27:连续几轮抓不到的卡推一条提醒。页面上它们只是「沿用旧值」,
      # 不报错也不缺卡,下面的 guard 拦不住。脚本自己永远返回 0。
      - name: check stale cards
        if: always()
        run: python3 check_stale_cards.py

      - name: guard
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('raw_metrics.json')).get('metrics',{})))")
          echo "本次抓到 $n 张卡"
          # 2026-10-19:阈值 25 → 35。看板从只抓 18(51 卡)改成抓 18+24(去重后 73 卡),
          # 原来的 25 相当于「一半就放行」,现在 25 连三分之一都不到,
          # 新加的六章(0.99/付费墙/额度墙/邀请/语音)全缺也能过 guard。
          if [ "$n" -lt 35 ]; then echo "太少($n),跳过发布、保留上一版"; exit 1; fi
      # 从 Lark 变更登记表拉产品变更 → changes.json(页头的切点与改动日志用它)
      # 🛑 continue-on-error + 脚本自身也吞异常:Lark 挂了、权限被改回只读、网络不通,
      #    都不该让整轮渲染失败。拉不到就沿用上一次的 changes.json。
      - name: fetch product changes
        continue-on-error: true
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: python3 fetch_changes.py
      # 再跑一次:test_percent_scale_matches_fmt 要有 raw_metrics.json 才验得了量纲
      # (pct* 列出现 >1.5 的值 = 一定显示错)。抓数前那轮会跳过它。
      - name: unit tests (with data)
        run: python3 -m unittest discover -s tests

      - name: render
        # --history:把今天上榜的卡记进 anomaly_history.json,连续上榜的压制规则靠它。
        # 只有这一轮正式渲染加,本地试渲染不加 —— 否则连续计数会被手动渲染污染。
        run: python3 render_dashboard.py --raw raw_metrics.json --out site/index.html --history
      # ---- 能量定价实验:独立一页(带中英切换,给 Javier 看)----
      # 2026-11-19:这十张卡已并入主看板的「⑬ 能量定价实验」区,主 fetch 也抓看板 25 了,
      # 所以这里**不再单独抓一轮**,直接复用 raw_metrics.json 渲染独立页。
      # 独立页暂时保留,等主看板的中英切换做完再决定是否下线。
      # 🛑 continue-on-error:这一页渲染失败不能拖垮主看板的发布。
      - name: render energy A/B page
        continue-on-error: true
        run: python3 render_energy_ab.py --raw raw_metrics.json --out site/energy-ab.html
      - name: push
        run: |
          git config user.name  "soulmap-bot"
          git config user.email "bot@users.noreply.github.com"
          # 🛑 site/ 之外还有三样要带上:运行记录、连续上榜的计数、Lark 变更的本地兜底。
          #    漏了的话它们只存在于 runner 上,下一轮就没了。
          git add -A site/ logs/ anomaly_history.json changes.json
          git commit -m "dashboard $(date -u +%F_%H%M)" || { echo "no change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            echo "push 被拒,重试 $i…"; sleep 5
          done
          echo "push 失败"; exit 1
