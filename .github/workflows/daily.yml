name: SoulMap dashboard daily
on:
  schedule:
    # 🔴 2026-11-05 由一天 5 次改成**一天 1 次**,省 Actions 免费额度。
    #    实测一次 run 的抓数三轮是 485 + 308 + 240 = **约 17.3 分钟**(再加渲染与推送)。
    #    5 次/天 ≈ 90 分钟/天 ≈ **2,700 分钟/月**,已经超出私有仓库 2,000 分钟的免费额度;
    #    1 次/天 ≈ **540 分钟/月**,留足余量(含手工 workflow_dispatch 的几次)。
    #    🛑 **代价**:一天只有一次机会,这次没抓满就只能等明天,或者手动点 Run workflow。
    #       guard(抓到 <35 张就不发布)仍然在,抓砸了线上保留上一版,不会出半截页面。
    #
    # 时间按新加坡(UTC+8)排;GitHub cron 只认 UTC,所以减 8 小时。
    # ⚠️ 计划任务是 best-effort:实测常晚 40min~2.5h,高负载时整次跳过。
    #
    # 🔴 2026-11-05 由 11:20 挪到 **12:20**,原因是 ETL 余量太薄,不是因为库忙:
    #    ① **ETL 余量**:实测昨天的 firebase 数落库时刻 11-03 是 10:01、
    #       **11-04 是 11:02、11-05 是 11:02** —— 近三天有两天压着 11:03 那条线。
    #       排 11:20 只剩 18 分钟余量,ETL 稍微晚一点,整天的页面就会拿到**前天**的
    #       firebase 数,而且页面上没有任何标记。挪到 12:20 余量变成 78 分钟。
    #    ② **库忙不是问题**:实测近 7 天每小时用户消息量,SGT 11 点是 416 条/时,
    #       全天第 6 低(最高是 02 点 652、17 点 577、22 点 572);12 点 522 条/时,
    #       仍比峰值低两成。而且 11-05 那次手动跑是 **17:33 起跑(全天第二忙的时段)**,
    #       83/86 张、17 分钟跑完;11-03 那次灾难性的 79 分钟反而起于 20:04(较闲时段)——
    #       **慢的根因是 socket 涓流超时那个 bug(已修),跟 App 流量没有关系。**
    #    ③ **Actions 的 cron 是 best-effort**,实测常晚 40min~2.5h ⇒ 实际起跑多半落在
    #       13:00~14:50,那也正好避开 17 点以后和凌晨那两段高峰。
    #
    # 2026-09-07 定下的两条仍然适用:
    #  ① 必须排在 ETL 之后才能稳定拿到昨天的数 —— 排早了会变成"ETL 比它早就有昨天、
    #     比它晚就只有前天",同一张卡隔天口径不同,比晚一小时更糟。
    #  ② 分钟数从整点挪到 :20。Actions 在每小时 :00 排队最挤,错开能实测缩短延迟。
    - cron: "20 4 * * *"    # 新加坡 12:20(ETL 之后留 78 分钟余量;避开 17 点后与凌晨两段高峰)
    #  - cron: "20 3 * * *"   # 新加坡 11:20(2026-11-05 之前用的,ETL 余量只有 18 分钟)
    # 🛑 以下四个 2026-11-05 停掉,留着备查,要恢复把注释去掉即可:
    #  - cron: "20 6 * * *"    # 新加坡 14:20
    #  - cron: "20 9 * * *"    # 新加坡 17:20
    #  - cron: "20 13 * * *"   # 新加坡 21:20
    #  - cron: "20 20 * * *"   # 新加坡 04:20(低峰,补抓前几次没抓全的硬骨头卡)
  workflow_dispatch: {}

# 2026-09-16 新增。GitHub cron 是 best-effort,实测常晚 40min~2.5h ——
# 延迟大的时候前一次还在跑、下一次就排上来了,两次 run 同时对 Metabase 打 4 并发,
# 47 张卡每张都要全表扫 firebase_event(无 event_name 索引),Metabase 被压住后
# 连 /api/session 都会超时。这里让同组的 run 排队而不是叠加。
# cancel-in-progress: false —— 正在跑的那次可能已经抓到大半,别掐掉。
concurrency:
  group: soulmap-dashboard
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 2026-09-16 新增。放在 fetch 之前,因为抓数要 10 多分钟 ——
      # 渲染脚本的语法错如果等到 render 那步才暴露,这一整轮卡全白抓了。
      # 实测踩过:卡片定义列表里两条元组之间漏了逗号(中间还隔着注释行),
      # Python 读成 (元组)(元组) 去调用,报 TypeError 而不是 SyntaxError。
      # 用 -W error::SyntaxWarning 把「perhaps you missed a comma」这类警告升成错误才拦得住。
      - name: syntax check
        run: |
          python3 -W error::SyntaxWarning -c "
          import ast, sys
          for f in ['fetch_metabase.py', 'render_dashboard.py']:
              src = open(f).read()
              ast.parse(src)
              compile(src, f, 'exec')
              print(f'  OK {f}')
          "

      - name: fetch
        env:
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        # 并发抓卡:第1轮 4 并发拼吞吐,第2轮 2、第3轮 1,后面几轮只剩硬骨头,降并发给每张卡完整带宽。
        # 实测(2026-08-04):串行 6 轮 55 分钟 / 缺 7  →  平并发4 12 分钟 / 缺 6  →  递减 17 分钟 / 缺 7。
        # ⚠️ 2026-10-19 起抓两个看板(18+24),卡数 51 → 73,整体耗时会比上面那组实测更长。
        # 那 6-7 张卡在 Metabase 侧就是 >60 秒,并发 1 也救不回来 —— 调度到此为止,要归零得靠兜底。
        run: python3 fetch_metabase.py --out raw_metrics.json
      - name: guard
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('raw_metrics.json')).get('metrics',{})))")
          echo "本次抓到 $n 张卡"
          # 2026-10-19:阈值 25 → 35。看板从只抓 18(51 卡)改成抓 18+24(去重后 73 卡),
          # 原来的 25 相当于「一半就放行」,现在 25 连三分之一都不到,
          # 新加的六章(0.99/付费墙/额度墙/邀请/语音)全缺也能过 guard。
          if [ "$n" -lt 35 ]; then echo "太少($n),跳过发布、保留上一版"; exit 1; fi
      - name: render
        run: python3 render_dashboard.py --raw raw_metrics.json --out site/index.html
      - name: push
        run: |
          git config user.name  "soulmap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/index.html
          git commit -m "dashboard $(date -u +%F_%H%M)" || { echo "no change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            echo "push 被拒,重试 $i…"; sleep 5
          done
          echo "push 失败"; exit 1
